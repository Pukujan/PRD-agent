name: acs-gates

# Agent-stack gates for PRD-agent: ACS multi-agent hot-loader 0.1.0 (ACS 0.2.0)
# with full PCM 0.7.0, full CGM 0.5.12, and the OIO issue-log surface,
# following release train "current". Fail closed: any failed or skipped step
# fails the `gates` job, and `gates` is the required status check on main.
#
# Pins are the certified commits in Pukujan/agent-stack-train
# stack-releases.json. When one component moves, all four must move together.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acs-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    env:
      PCM_COMMIT: 85e6aa7a889b57aeef270213c37258194717e358
      CGM_COMMIT: 5c8c5f167098d04cf96fb1fe449880001a1edd14
      ACS_COMMIT: 3df982adc008b9caa4b3a9991f77486393c9a30b
      OIO_COMMIT: 402a46ec9544fddacb8cc366b07c7fc44b096b69
      ACS_MODULE: modules/coordination/multi-agent-hotload/v0.1.0
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Prepare validation tools
        shell: bash
        run: |
          set -euo pipefail
          validation_root=$(mktemp -d "$RUNNER_TEMP/acs-validation.XXXXXX")
          echo "VALIDATION_ROOT=$validation_root" >> "$GITHUB_ENV"
          uv venv --quiet --python 3.11 "$validation_root/venv"
          uv pip install --quiet --python "$validation_root/venv/bin/python" jsonschema
          echo "PY=$validation_root/venv/bin/python" >> "$GITHUB_ENV"

      - name: Validate stack-manifest against the release train
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/Pukujan/agent-stack-train.git "$VALIDATION_ROOT/train"
          "$PY" "$VALIDATION_ROOT/train/scripts/check_manifest.py" \
            --manifest stack-manifest.json \
            --train "$VALIDATION_ROOT/train/stack-releases.json"

      - name: Validate pinned PCM continuity state
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Pukujan/project-continuity-modules.git "$VALIDATION_ROOT/pcm"
          git -C "$VALIDATION_ROOT/pcm" checkout --quiet "$PCM_COMMIT"
          PYTHONPATH="$VALIDATION_ROOT/pcm/src" "$PY" -m continuity validate --root .

      - name: Validate full CGM adapter
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Pukujan/content-generation-modules.git "$VALIDATION_ROOT/cgm"
          git -C "$VALIDATION_ROOT/cgm" checkout --quiet "$CGM_COMMIT"
          "$PY" "$VALIDATION_ROOT/cgm/scripts/validate_content_system.py" \
            --root "$VALIDATION_ROOT/cgm" \
            --adapter .content-system \
            --project-root .

      - name: Validate pinned ACS hot-loader
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Pukujan/agent-custom-setup.git "$VALIDATION_ROOT/acs"
          git -C "$VALIDATION_ROOT/acs" checkout --quiet "$ACS_COMMIT"
          "$PY" "$VALIDATION_ROOT/acs/$ACS_MODULE/scripts/hotload_check.py" \
            --root "$VALIDATION_ROOT/acs/$ACS_MODULE" \
            --assignment "$GITHUB_WORKSPACE/.coord/assignment.json" \
            --cgm-root "$VALIDATION_ROOT/cgm" \
            --adopter-root "$GITHUB_WORKSPACE"

      - name: Validate installed OIO issue-log surface
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Pukujan/observational-issue-ops.git "$VALIDATION_ROOT/oio"
          git -C "$VALIDATION_ROOT/oio" checkout --quiet "$OIO_COMMIT"
          "$PY" "$VALIDATION_ROOT/oio/.github/scripts/oio_installer.py" \
            --target "$GITHUB_WORKSPACE" --project-id Pukujan/PRD-agent --check
